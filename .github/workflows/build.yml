name: Build INV Monitor Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: |
          pio run -e esp32-s3-devkitc-1

      - name: Prepare firmware files
        run: |
          mkdir -p firmware
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin firmware/INV_MONITOR.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin firmware/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin firmware/partitions.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: INV_MONITOR-Firmware
          path: firmware/
